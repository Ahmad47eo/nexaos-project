name: Build QEMU-Wasm runtime

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qemu-wasm-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout NexaOS ISO Lab
        uses: actions/checkout@v4

      - name: Checkout QEMU-Wasm
        uses: actions/checkout@v4
        with:
          repository: ktock/qemu-wasm
          path: qemu-wasm

      - name: Patch stale zlib download URL
        run: |
          sed -i 's#https://zlib.net/zlib-$ZLIB_VERSION.tar.xz#https://github.com/madler/zlib/releases/download/v$ZLIB_VERSION/zlib-$ZLIB_VERSION.tar.xz#' qemu-wasm/Dockerfile

      - name: Build QEMU-Wasm container
        run: docker build -t buildqemu qemu-wasm

      - name: Start build container
        run: docker run --rm -d --name build-qemu-wasm -v "$PWD/qemu-wasm:/qemu" buildqemu

      - name: Prepare SDL2 for browser graphics
        run: |
          docker exec build-qemu-wasm embuilder build sdl2
          docker exec build-qemu-wasm sh -lc 'ls -l /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/ports/SDL2* 2>/dev/null || true'

      - name: Configure x86_64 QEMU-Wasm
        run: |
          EXTRA_CFLAGS="-O3 -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc -sOFFSCREENCANVAS_SUPPORT=1 -sPTHREAD_POOL_SIZE=2 --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js -sUSE_SDL=2"
          docker exec build-qemu-wasm emconfigure /qemu/configure             --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix=             --without-default-features --enable-system --enable-sdl --with-coroutine=fiber --enable-virtfs             --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS"             --extra-ldflags="-sUSE_SDL=2 -sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"

      - name: Compile QEMU-Wasm
        run: docker exec build-qemu-wasm emmake make -j2 qemu-system-x86_64

      - name: Package runtime assets
        run: |
          rm -rf qemu
          mkdir -p qemu/pack
          cp qemu-wasm/pc-bios/bios-256k.bin qemu/pack/
          cp qemu-wasm/pc-bios/vgabios-stdvga.bin qemu/pack/
          cp qemu-wasm/pc-bios/kvmvapic.bin qemu/pack/
          cp qemu-wasm/pc-bios/linuxboot_dma.bin qemu/pack/
          docker cp qemu/pack build-qemu-wasm:/
          docker cp build-qemu-wasm:/build/qemu-system-x86_64 qemu/qemu-system-x86_64.js
          for f in qemu-system-x86_64.wasm qemu-system-x86_64.worker.js; do
            docker cp build-qemu-wasm:/build/$f qemu/$f
          done
          docker exec build-qemu-wasm /bin/sh -c "/emsdk/upstream/emscripten/tools/file_packager.py qemu-system-x86_64.data --preload /pack > load.js"
          docker cp build-qemu-wasm:/build/qemu-system-x86_64.data qemu/qemu-system-x86_64.data
          docker cp build-qemu-wasm:/build/load.js qemu/load.js

          echo "=== QEMU runtime package ==="
          ls -lh qemu/
          test -s qemu/load.js
          test -s qemu/qemu-system-x86_64.js
          test -s qemu/qemu-system-x86_64.wasm
          test -s qemu/qemu-system-x86_64.data
          test -s qemu/qemu-system-x86_64.worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
